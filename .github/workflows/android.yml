name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Get Version Info
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | awk '{print $3}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/porfolio_${{ steps.get_version.outputs.version_name }}_${{ steps.get_version.outputs.version_code }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: porfolio_${{ steps.get_version.outputs.version_name }}_${{ steps.get_version.outputs.version_code }}.apk
          path: app/build/outputs/apk/debug/porfolio_${{ steps.get_version.outputs.version_name }}_${{ steps.get_version.outputs.version_code }}.apk