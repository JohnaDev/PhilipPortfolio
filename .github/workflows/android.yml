name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Get Version Info
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | awk '{print $3}')
          # Note: If version is calculated by GitInfo, you might need to extract it differently 
          # or just use a wildcard for the upload path.
          echo "file_name=porfolio_${VERSION_NAME}_${VERSION_CODE}.apk" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: porfolio-build
          path: app/build/outputs/apk/debug/porfolio_*.apk